name: Build Windows

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kivy[base]>=2.3.0" pyinstaller
          pip install ./libs/kivyshell

      - name: Build with PyInstaller
        run: pyinstaller yawop.spec --noconfirm

      - name: Package zip
        run: Compress-Archive -Path dist/yawop/* -DestinationPath yawop-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yawop-windows
          path: yawop-windows.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: yawop-windows
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
